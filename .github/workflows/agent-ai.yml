name: Agent AI
on:
  push:
    branches: [main]
    paths: ['agent-ai/**', '.github/workflows/agent-ai.yml']
  pull_request:
    paths: ['agent-ai/**', '.github/workflows/agent-ai.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: agent-ai
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: agent-ai/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm check
      - run: pnpm --silent eval > retrieval-evaluation.json
      - run: pnpm audit --audit-level high
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: retrieval-evaluation
          path: agent-ai/retrieval-evaluation.json
