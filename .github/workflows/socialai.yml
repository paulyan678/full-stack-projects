name: SocialAI

on:
  push:
    branches: [main]
    paths: ['socialai/**', '.github/workflows/socialai.yml']
  pull_request:
    paths: ['socialai/**', '.github/workflows/socialai.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: socialai/backend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.1"
          cache-dependency-path: socialai/backend/go.mod
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/server

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: socialai/web
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: socialai/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --audit-level high
